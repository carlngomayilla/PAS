name: deploy-production

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, pas-production]
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          test -d "$DEPLOY_PATH"
          test -x "$DEPLOY_PATH/scripts/deploy.sh"

      - name: Report deployment repository state
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"
          git status --short --branch
          git log --oneline --left-right --cherry-pick --max-count=20 HEAD...origin/main
          git show --name-status --format=fuller --no-renames HEAD

      - name: Reconcile preserved production commit
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          server_head="$(git rev-parse HEAD)"

          if [ "$(git symbolic-ref --short HEAD)" != "main" ]; then
            echo "The production repository is not on the main branch." >&2
            exit 1
          fi

          if git merge-base --is-ancestor "$server_head" origin/main; then
            exit 0
          fi

          preserved_head="e073cf472aebabf8e0bbaf2e910eb612c0c3c8ec"
          if [ "$server_head" != "$preserved_head" ]; then
            echo "Unexpected divergent production commit: $server_head" >&2
            exit 1
          fi

          if [ "$(git cherry origin/main "$server_head")" != "- $server_head" ]; then
            echo "The production-only commit is not preserved on origin/main." >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Tracked production files contain uncommitted changes." >&2
            exit 1
          fi

          git rebase origin/main

      - name: Deploy verified main branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          GIT_TERMINAL_PROMPT=0 bash scripts/deploy.sh
