name: deploy-production

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, pas-production]
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          test -d "$DEPLOY_PATH"
          test -x "$DEPLOY_PATH/scripts/deploy.sh"

      - name: Report deployment repository state
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"
          git status --short --branch
          git log --oneline --left-right --cherry-pick --max-count=20 HEAD...origin/main

      - name: Deploy verified main branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          GIT_TERMINAL_PROMPT=0 bash scripts/deploy.sh
