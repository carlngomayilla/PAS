name: deploy-production

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, pas-production]
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          test -d "$DEPLOY_PATH"
          test -x "$DEPLOY_PATH/scripts/deploy.sh"

      - name: Report deployment repository state
        id: repository_state
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"
          git status --short --branch
          git log --oneline --left-right --cherry-pick --max-count=20 HEAD...origin/main
          git show --name-status --format=fuller --no-renames HEAD
          if [ "$(git rev-parse HEAD)" = "e073cf472aebabf8e0bbaf2e910eb612c0c3c8ec" ]; then
            git format-patch --stdout "$(git merge-base HEAD origin/main)..HEAD" > "$RUNNER_TEMP/production-local.patch"
            echo "patch_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve production-only commit
        if: steps.repository_state.outputs.patch_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-local-commit-${{ github.run_id }}
          path: ${{ runner.temp }}/production-local.patch
          retention-days: 1

      - name: Deploy verified main branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/pas-anbg/PAS}"
          cd "$DEPLOY_PATH"
          GIT_TERMINAL_PROMPT=0 bash scripts/deploy.sh
